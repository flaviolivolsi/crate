name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: smoke tests
        run: bats tests/bats/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check bin/crate
      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          additional_files: "config/sxhkd.example"
